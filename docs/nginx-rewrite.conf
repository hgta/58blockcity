# ============================================================
# 11. 别名域：renqizhi 全部别名 → 301 → renqizhi.com
# 说明：覆盖 .cn 及其 www、.com 的 www；DNS 必须保留解析，否则 301 无法生效
# 注意：return 目标必须是不带 www 的主域
# ============================================================
server {
    listen 80;
    listen 443 ssl;
    server_name renqizhi.cn www.renqizhi.cn www.renqizhi.com;

    return 301 https://renqizhi.com$request_uri;
}

