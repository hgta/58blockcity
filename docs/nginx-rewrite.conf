# ============================================================
# 14. help.58.tl 帮助中心子站（change: help-center-ai-assistant）
# 根目录：/www/wwwroot/58git/58blockcity/help
# 说明：项目内 help/.htaccess 仅对 Apache 有效，Nginx 必须配以下规则
#       （/faq /glossary /ask /category/... /article/... 等伪静态依赖此配置）
# ============================================================
server {
    listen 80;
    listen 443 ssl;
    server_name help.58.tl;

    root /www/wwwroot/58git/58blockcity/help;
    index index.php index.html;

    # 强制 HTTPS
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # ---------- 动态路由（.htaccess 的 Nginx 等价物） ----------
    rewrite ^/category/([a-z0-9-]+)/?$  /index.php?route=category&slug=$1 last;
    rewrite ^/article/([a-z0-9-]+)/?$   /index.php?route=article&slug=$1  last;
    rewrite ^/search/?$                 /index.php?route=search           last;
    rewrite ^/faq/?$                    /index.php?route=faq              last;
    rewrite ^/glossary/?$               /index.php?route=glossary         last;
    rewrite ^/ask/?$                    /index.php?route=ask              last;
    rewrite ^/sitemap\.xml$             /index.php?route=sitemap          last;

    # ---------- 旧静态页 301 → 新地址 ----------
    rewrite ^/help\.html$                          / permanent;
    rewrite ^/glossary\.html$                      /glossary permanent;
    rewrite ^/buy-blocks-guide\.html$              /article/buy-blocks-guide permanent;
    rewrite ^/create-city\.html$                   /article/create-city-guide permanent;
    rewrite ^/why-create-city(-[a-z]+)?\.html$     /article/why-create-city$1 permanent;

    # AI 流式对话在 www.58.tl/api/ai/chat.php，代码已发送 X-Accel-Buffering: no，无需额外配置

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

