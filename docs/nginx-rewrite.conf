# ============================================================
# 1. www.58.tl 主站
# 根目录建议：/www/wwwroot/58git/58blockcity
# ============================================================
server {
    listen 80;
    listen 443 ssl;
    server_name www.58.tl 58.tl;

    # root 请按实际部署路径修改
    root /www/wwwroot/58git/58blockcity;
    index index.php index.html;

    # 强制 HTTPS（如已通过 Cloudflare 处理可注释）
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # 城市详情页
    rewrite ^/city/([a-z]+)\.html$ /city.php?pinyin=$1 last;

    # ===== 帮助中心（www 域名下 /help/ 子路径访问，change: help-center-ai-assistant）=====
    # 动态路由
    rewrite ^/help/category/([a-z0-9-]+)/?$ /help/index.php?route=category&slug=$1 last;
    rewrite ^/help/article/([a-z0-9-]+)/?$  /help/index.php?route=article&slug=$1  last;
    rewrite ^/help/search/?$                /help/index.php?route=search           last;
    rewrite ^/help/faq/?$                   /help/index.php?route=faq              last;
    rewrite ^/help/glossary/?$              /help/index.php?route=glossary         last;
    rewrite ^/help/ask/?$                   /help/index.php?route=ask              last;
    rewrite ^/help/sitemap\.xml$            /help/index.php?route=sitemap          last;
    # 旧静态帮助页 301 → 新地址
    rewrite ^/help/help\.html$                          /help/ permanent;
    rewrite ^/help/glossary\.html$                      /help/glossary permanent;
    rewrite ^/help/buy-blocks-guide\.html$              /help/article/buy-blocks-guide permanent;
    rewrite ^/help/create-city\.html$                   /help/article/create-city-guide permanent;
    rewrite ^/help/why-create-city(-[a-z]+)?\.html$     /help/article/why-create-city$1 permanent;
    rewrite ^/mall/product/([0-9]+)-.*\.html$ /mall/product/detail.php?id=$1 last;
    rewrite ^/mall/shop/([0-9]+)-.*\.html$ /mall/shop/view.php?id=$1 last;
    rewrite ^/mall/model/([0-9]+)-.*\.html$ /mall/model/view.php?id=$1 last;
    rewrite ^/mall/author/([0-9]+)-.*\.html$ /mall/author/view.php?id=$1 last;

    # 互访圈（主站域名访问时兼容）
    rewrite ^/circle/([0-9]+)-.*\.html$ /hufang/circles/view.php?id=$1 last;

    # NFT（主站域名访问时兼容）
    rewrite ^/nft/([0-9]+)-.*\.html$ /nft/nft/view.php?id=$1 last;

    # Sitemap
    rewrite ^/sitemap\.xml$ /sitemap.php last;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP 处理（请按实际 PHP 版本调整）
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# ============================================================
# 2. mall.58.tl 商城子站
# 根目录建议：/www/wwwroot/58git/58blockcity/mall
# ============================================================
server {
    listen 80;
    listen 443 ssl;
    server_name mall.58.tl;

    root /www/wwwroot/58git/58blockcity/mall;
    index index.php index.html;

    # 强制 HTTPS
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # 商品详情伪静态
    rewrite ^/product/([0-9]+)-.*\.html$ /product/detail.php?id=$1 last;

    # 店铺详情伪静态
    rewrite ^/shop/([0-9]+)-.*\.html$ /shop/view.php?id=$1 last;

    # ===== 模特库已抽取为独立子站 model.58.tl，旧地址 301（必须置于 location / 之前）=====
    rewrite ^/model/list\.php$         https://model.58.tl/list.php permanent;
    rewrite ^/model/([0-9]+)-.*\.html$ https://model.58.tl/m/$1 permanent;
    rewrite ^/apply/model\.php$        https://model.58.tl/apply.php permanent;
    rewrite ^/apply/my\.php$           https://model.58.tl/my.php permanent;

    # 作者详情伪静态
    rewrite ^/author/([0-9]+)-.*\.html$ /author/view.php?id=$1 last;

    # 商品分类列表（可选）
    rewrite ^/product/category/([0-9]+)-.*\.html$ /product/list.php?category=$1 last;

    # Sitemap
    rewrite ^/sitemap\.xml$ /sitemap.php last;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

